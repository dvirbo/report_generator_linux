# Report Generator System - Configuration File
# Copy this file to config.ini and update with your actual values

[database]
host = localhost
port = 1521
service_name = FREEPDB1
username = MIZRAHI_CUSTOM
# Password is retrieved from secure_password_store using the key below
password_key = db_password

# Alternative: use TNS connection string
# connection_string = username/password@tns_alias
connection_timeout = 30
command_timeout = 300

[scheduler]
# Note: Scheduling handled externally by Control-M
# This application is triggered by Control-M and processes reports on demand
max_concurrent_reports = 5

[email]
# SMTP configuration - Update with your SMTP server details
smtp_server = A-SMTP.mehmail.loc
smtp_port = 25
# Try enabling STARTTLS - some servers require TLS before authentication
smtp_use_tls = yes
# Server requires authentication even though it may not advertise AUTH methods
smtp_require_auth = yes
smtp_username = ActimizeAppUser

# Password is retrieved from secure_password_store using the key below
smtp_password_key = smtp_password
from_email = ActimizeAML@Mehish1.co.il
from_name = Automated Report System
max_email_size_kb = 10240
smtp_timeout = 30
    
[logging]
level = DEBUG
file_path = logs/report_generator.log
file_size_mb = 100
backup_count = 30
log_to_database = yes
log_to_file = yes
log_to_console = no

[files]
temp_directory = temp
csv_encoding = utf-8-sig
cleanup_temp_files = yes

[cleanup]
retention_days_execution_log = 90
retention_days_delivery_log = 90
auto_cleanup_enabled = yes
cleanup_run_day = Sunday

[branches]
# Comma-separated list of BU identifiers that use manager-based processing
# For these BUs, the system will fetch manager IDs and execute queries separately for each manager
# Example: manager_bu_list = 461,462,463
manager_bu_list = 

[deployment]
python_version = 3.6.8
service_name = ReportGeneratorService
service_display_name = Report Generator Service
service_description = Automated report generation and email distribution service
